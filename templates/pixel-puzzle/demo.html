<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pixel Puzzle Template Demo</title>
<style>
html,body{margin:0;padding:0;background:#000;font-family:system-ui,sans-serif;color:#fff}
#stage{position:relative;width:480px;height:640px;margin:0 auto;overflow:hidden;background:#141422;box-shadow:0 0 40px rgba(180,140,255,0.35)}
#board{position:absolute;left:40px;top:120px;width:400px;height:400px;background-repeat:repeat;background-size:80px 80px;border:2px solid rgba(255,255,255,0.15)}
.spr{position:absolute;image-rendering:pixelated;pointer-events:none}
#hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;font-family:monospace;font-size:16px;text-shadow:0 0 4px #000;z-index:20}
#next{position:absolute;top:56px;left:16px;font-family:monospace;font-size:12px;color:#aaf;z-index:20}
#banner{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;font-size:11px;color:#bbf;font-family:monospace;z-index:20;opacity:0.8}
</style></head><body>
<div id="stage">
  <div id="board"></div>
  <div id="hud"><span>SCORE 024100</span><span>MOVES 12</span></div>
  <div id="next">NEXT →</div>
  <div id="banner">PIXEL PUZZLE TEMPLATE — sprites generated by sprite-generator</div>
</div>
<script>
const OUTPUT=(new URL(location.href).searchParams.get('output'))||'../../output';
const S={red:`${OUTPUT}/gem/gem_red.png`,blue:`${OUTPUT}/gem/gem_blue.png`,green:`${OUTPUT}/gem/gem_green.png`,yellow:`${OUTPUT}/gem/gem_yellow.png`,purple:`${OUTPUT}/gem/gem_purple.png`,
bomb:`${OUTPUT}/special/gem_bomb.png`,rainbow:`${OUTPUT}/special/gem_rainbow.png`,
sparkle:`${OUTPUT}/effect/sparkle_effect.png`,burst:`${OUTPUT}/effect/clear_burst.png`,tile:`${OUTPUT}/tile/board_tile.png`};
const stage=document.getElementById('stage');
document.getElementById('board').style.backgroundImage=`url(${S.tile})`;
function spr(src,x,y,w,h,z=1){const e=document.createElement('img');e.className='spr';e.src=src;
e.style.left=(x-w/2)+'px';e.style.top=(y-h/2)+'px';e.style.width=w+'px';e.style.height=h+'px';e.style.zIndex=z;
e.onerror=()=>{e.style.outline='1px dashed #f55';e.style.background='rgba(255,0,0,0.15)'};stage.appendChild(e);return e}
// 5x5 gem grid on the 400x400 board, cells 80px wide
const grid=[
 ['red','blue','green','yellow','red'],
 ['purple','red','red','red','blue'],   // horizontal match-3 forming
 ['blue','green','bomb','yellow','purple'],
 ['yellow','purple','rainbow','blue','green'],
 ['green','red','yellow','purple','blue']
];
for(let r=0;r<5;r++)for(let c=0;c<5;c++){
  const gx=40+c*80+40, gy=120+r*80+40;
  spr(S[grid[r][c]],gx,gy,64,64,3);
}
// Sparkle on the forming match-3 row
spr(S.sparkle, 40+1*80+40, 120+1*80+40, 80, 80, 4);
spr(S.sparkle, 40+2*80+40, 120+1*80+40, 80, 80, 4);
spr(S.sparkle, 40+3*80+40, 120+1*80+40, 80, 80, 4);
// Clear burst on the bomb cell
spr(S.burst, 40+2*80+40, 120+2*80+40, 90, 90, 5);
// "Next piece" preview top-right (hud)
spr(S.rainbow, 430, 70, 44, 44, 6);
</script></body></html>
