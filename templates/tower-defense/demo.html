<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tower Defense Template Demo</title>
<style>
html,body{margin:0;padding:0;background:#000;font-family:system-ui,sans-serif;color:#fff}
#stage{position:relative;width:720px;height:540px;margin:0 auto;overflow:hidden;box-shadow:0 0 40px rgba(120,200,120,0.3)}
#grass{position:absolute;inset:0;background-repeat:repeat;background-size:128px 128px}
.path-tile{position:absolute;width:80px;height:80px;background-size:80px 80px}
.spr{position:absolute;image-rendering:pixelated;pointer-events:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:monospace;font-size:14px;text-shadow:0 0 4px #000;z-index:20}
#banner{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;font-size:11px;color:#fff;font-family:monospace;z-index:20;opacity:0.8}
</style></head><body>
<div id="stage">
  <div id="grass"></div>
  <div id="hud"><span>LIVES 20</span><span>GOLD 470</span><span>WAVE 7/15</span></div>
  <div id="banner">TOWER DEFENSE TEMPLATE — sprites generated by sprite-generator</div>
</div>
<script>
const OUTPUT=(new URL(location.href).searchParams.get('output'))||'../../output';
const S={arrow:`${OUTPUT}/tower/tower_arrow.png`,cannon:`${OUTPUT}/tower/tower_cannon.png`,magic:`${OUTPUT}/tower/tower_magic.png`,
grunt:`${OUTPUT}/enemy/creep_grunt.png`,fast:`${OUTPUT}/enemy/creep_fast.png`,tank:`${OUTPUT}/enemy/creep_tank.png`,
pArrow:`${OUTPUT}/projectile/projectile_arrow.png`,pBall:`${OUTPUT}/projectile/projectile_cannonball.png`,
coin:`${OUTPUT}/pickup/gold_coin.png`,path:`${OUTPUT}/tile/path_tile.png`,grass:`${OUTPUT}/tile/grass_tile.png`};
const stage=document.getElementById('stage');
document.getElementById('grass').style.backgroundImage=`url(${S.grass})`;
// Build an L-shaped path: starts at left middle, goes right, then down
const pathCells=[];
for(let x=0;x<9;x++) pathCells.push([x,3]);
for(let y=3;y<7;y++) pathCells.push([5,y]);
pathCells.forEach(([cx,cy])=>{const t=document.createElement('img');t.src=S.path;t.className='path-tile';
t.style.left=(cx*80)+'px';t.style.top=(cy*80)+'px';t.style.zIndex=1;
t.onerror=()=>{t.style.outline='1px dashed #f55';t.style.background='rgba(255,0,0,0.15)'};stage.appendChild(t)});
function spr(src,x,y,w,h,z=1){const e=document.createElement('img');e.className='spr';e.src=src;
e.style.left=(x-w/2)+'px';e.style.top=(y-h/2)+'px';e.style.width=w+'px';e.style.height=h+'px';e.style.zIndex=z;
e.onerror=()=>{e.style.outline='1px dashed #f55';e.style.background='rgba(255,0,0,0.15)'};stage.appendChild(e);return e}
// Towers on the grass next to the path (three types, visible)
spr(S.arrow,  160, 160, 96, 128, 4);
spr(S.cannon, 400, 200, 112, 112, 4);
spr(S.magic,  520, 420, 96, 144, 4);
// Creeps walking the path — three variants in formation
spr(S.grunt,  120, 280, 80, 80, 5);
spr(S.grunt,  220, 280, 80, 80, 5);
spr(S.fast,   320, 280, 72, 72, 5);
spr(S.tank,   440, 280, 112, 112, 5);
spr(S.grunt,  440, 440, 80, 80, 5);
// Projectiles in flight
spr(S.pArrow, 180, 260, 56, 16, 6);
spr(S.pBall,  400, 260, 32, 32, 6);
// Coin rewards popping up
spr(S.coin,   260, 320, 40, 40, 7);
spr(S.coin,   460, 320, 40, 40, 7);
</script></body></html>
