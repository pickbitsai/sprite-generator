<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Platformer Template Demo</title>
<style>
html,body{margin:0;padding:0;background:#000;font-family:system-ui,sans-serif;color:#fff}
#stage{position:relative;width:640px;height:400px;margin:0 auto;overflow:hidden;background:#8fd5ff;box-shadow:0 0 40px rgba(80,200,255,0.3)}
#bg{position:absolute;inset:0;background-repeat:repeat-x;background-position:0 40%}
#ground-row{position:absolute;bottom:0;left:0;right:0;height:96px;background-repeat:repeat-x;background-size:96px 96px}
.spr{position:absolute;image-rendering:pixelated;pointer-events:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:monospace;font-size:14px;text-shadow:0 0 4px #000;z-index:20}
#banner{position:absolute;bottom:4px;left:8px;right:8px;text-align:center;font-size:11px;color:#003;font-family:monospace;z-index:20;opacity:0.7}
</style></head><body>
<div id="stage">
  <div id="bg"></div>
  <div id="ground-row"></div>
  <div id="hud"><span id="lives">♥ x3</span><span id="coins">★ 042</span></div>
  <div id="banner">PLATFORMER TEMPLATE — sprites generated by sprite-generator</div>
</div>
<script>
const OUTPUT = (new URL(location.href).searchParams.get('output')) || '../../output';
const S={hero:`${OUTPUT}/character/hero_idle.png`,slime:`${OUTPUT}/enemy/enemy_slime.png`,bat:`${OUTPUT}/enemy/enemy_bat.png`,
coin:`${OUTPUT}/pickup/coin.png`,heart:`${OUTPUT}/pickup/heart_pickup.png`,flag:`${OUTPUT}/prop/checkpoint_flag.png`,
ground:`${OUTPUT}/tile/ground_tile.png`,plat:`${OUTPUT}/tile/platform_tile.png`,spike:`${OUTPUT}/hazard/spike_hazard.png`,
bg:`${OUTPUT}/background/bg_hills.png`};
const stage=document.getElementById('stage');
document.getElementById('bg').style.backgroundImage=`url(${S.bg})`;
document.getElementById('bg').style.backgroundSize='auto 60%';
document.getElementById('ground-row').style.backgroundImage=`url(${S.ground})`;
function spr(src,x,y,w,h,z=1){const e=document.createElement('img');e.className='spr';e.src=src;
e.style.left=(x-w/2)+'px';e.style.top=(y-h/2)+'px';e.style.width=w+'px';e.style.height=h+'px';e.style.zIndex=z;
e.onerror=()=>{e.style.outline='1px dashed #f55';e.style.background='rgba(255,0,0,0.15)'};stage.appendChild(e);return e}
// Platforms (floating)
const plat=(x,y,n)=>{for(let i=0;i<n;i++)spr(S.plat,x+i*64,y,64,32,2)};
plat(80,220,3);  plat(380,180,3);  plat(260,140,2);
// Ground hazards
spr(S.spike,300,352,64,48,3);
// Checkpoint
spr(S.flag,560,280,72,96,3);
// Enemies
spr(S.slime,160,328,56,56,4);        // on ground
spr(S.slime,420,152,48,48,4);        // on high platform
spr(S.bat,220,80,72,56,4);           // flying
spr(S.bat,500,100,72,56,4);          // flying
// Pickups
spr(S.coin,120,188,32,32,4);
spr(S.coin,432,148,32,32,4);
spr(S.coin,288,108,32,32,4);
spr(S.heart,310,108,36,36,4);
// Hero
spr(S.hero,70,304,64,80,5);
</script></body></html>
