<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Racing Template Demo</title>
<style>
html,body{margin:0;padding:0;background:#000;font-family:system-ui,sans-serif;color:#fff}
#stage{position:relative;width:480px;height:720px;margin:0 auto;overflow:hidden;background:#3a7c3a;box-shadow:0 0 40px rgba(80,255,120,0.25)}
#road{position:absolute;left:120px;top:0;width:240px;height:100%;background-repeat:repeat-y;background-size:240px 160px}
.spr{position:absolute;image-rendering:pixelated;pointer-events:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:monospace;font-size:14px;text-shadow:0 0 4px #000;z-index:20}
#banner{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;font-size:11px;color:#cfc;font-family:monospace;z-index:20;opacity:0.8}
</style></head><body>
<div id="stage">
  <div id="road"></div>
  <div id="hud"><span>LAP 2/3</span><span>01:42.07</span></div>
  <div id="banner">RACING TEMPLATE — sprites generated by sprite-generator</div>
</div>
<script>
const OUTPUT=(new URL(location.href).searchParams.get('output'))||'../../output';
const S={pCar:`${OUTPUT}/car/player_car.png`,red:`${OUTPUT}/car/opponent_red.png`,green:`${OUTPUT}/car/opponent_green.png`,yellow:`${OUTPUT}/car/opponent_yellow.png`,
road:`${OUTPUT}/track/road_straight.png`,cone:`${OUTPUT}/obstacle/obstacle_cone.png`,barrel:`${OUTPUT}/obstacle/obstacle_barrel.png`,
boost:`${OUTPUT}/pickup/pickup_boost.png`,shield:`${OUTPUT}/pickup/pickup_shield.png`,finish:`${OUTPUT}/track/finish_line.png`};
const stage=document.getElementById('stage');
document.getElementById('road').style.backgroundImage=`url(${S.road})`;
function spr(src,x,y,w,h,z=1){const e=document.createElement('img');e.className='spr';e.src=src;
e.style.left=(x-w/2)+'px';e.style.top=(y-h/2)+'px';e.style.width=w+'px';e.style.height=h+'px';e.style.zIndex=z;
e.onerror=()=>{e.style.outline='1px dashed #f55';e.style.background='rgba(255,0,0,0.15)'};stage.appendChild(e);return e}
// Finish line near top (visible in overhead scroll)
const fin=document.createElement('img');fin.src=S.finish;fin.className='spr';fin.style.left='120px';fin.style.top='70px';fin.style.width='240px';fin.style.height='40px';fin.style.zIndex=2;fin.onerror=()=>{fin.style.outline='1px dashed #f55';fin.style.background='rgba(255,0,0,0.2)'};stage.appendChild(fin);
// Opponents in formation in front of player
spr(S.red,   180, 180, 70, 120, 3);
spr(S.yellow,300, 200, 70, 130, 3);
spr(S.green, 240, 310, 70, 120, 3);
// Obstacles scattered
spr(S.cone,  150, 400, 40, 40, 4);
spr(S.cone,  330, 440, 40, 40, 4);
spr(S.barrel,220, 460, 60, 60, 4);
// Pickups
spr(S.boost, 180, 520, 44, 44, 5);
spr(S.shield,300, 520, 44, 44, 5);
// Player car near bottom
spr(S.pCar,  240, 620, 72, 128, 6);
</script></body></html>
