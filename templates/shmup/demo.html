<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shmup Template Demo</title>
<style>
  html,body { margin:0; padding:0; background:#000; height:100%; overflow:hidden;
              font-family: -apple-system, system-ui, sans-serif; color:#fff; }
  #stage { position:relative; width:480px; height:720px; margin:0 auto; overflow:hidden;
           background:#0a0a1a; box-shadow:0 0 40px rgba(80,120,255,0.4); }
  #bg { position:absolute; inset:0; background-repeat:repeat; background-size:480px auto; }
  .spr { position:absolute; image-rendering: pixelated; pointer-events:none; }
  #hud { position:absolute; top:8px; left:8px; right:8px; display:flex;
         justify-content:space-between; font-size:14px; text-shadow:0 0 4px #000;
         font-family: monospace; z-index:10; }
  #banner { position:absolute; bottom:8px; left:8px; right:8px; text-align:center;
            font-size:11px; color:#8ab; font-family: monospace; z-index:10; opacity:0.8; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="hud"><span id="score">SCORE 012400</span><span id="lives">♥♥♥</span></div>
  <div id="banner">SHMUP TEMPLATE — sprites generated by sprite-generator</div>
</div>
<script>
const OUTPUT = (new URL(window.location.href).searchParams.get('output')) || '../../output';
const S = {
  ship:     `${OUTPUT}/ship/player_ship.png`,
  fighter:  `${OUTPUT}/enemy/enemy_fighter.png`,
  bomber:   `${OUTPUT}/enemy/enemy_bomber.png`,
  scout:    `${OUTPUT}/enemy/enemy_scout.png`,
  boss:     `${OUTPUT}/boss/boss_dreadnought.png`,
  pBullet:  `${OUTPUT}/projectile/bullet_player.png`,
  eBullet:  `${OUTPUT}/projectile/bullet_enemy.png`,
  missile:  `${OUTPUT}/projectile/missile.png`,
  boom:     `${OUTPUT}/effect/explosion.png`,
  pWeapon:  `${OUTPUT}/pickup/powerup_weapon.png`,
  pShield:  `${OUTPUT}/pickup/powerup_shield.png`,
  pLife:    `${OUTPUT}/pickup/powerup_life.png`,
  star:     `${OUTPUT}/background/star_bg.png`,
};

const stage = document.getElementById('stage');
const bg = document.getElementById('bg');
bg.style.backgroundImage = `url(${S.star})`;

function spr(src, x, y, w, h, z=1, rot=0) {
  const el = document.createElement('img');
  el.className = 'spr'; el.src = src;
  el.style.left = (x - w/2) + 'px'; el.style.top = (y - h/2) + 'px';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.zIndex = z;
  if (rot) el.style.transform = `rotate(${rot}deg)`;
  el.onerror = () => { el.style.outline = '1px dashed #f55'; el.style.background = 'rgba(255,0,0,0.15)'; };
  stage.appendChild(el);
  return el;
}

// --- Static showcase scene -------------------------------------------------
// Designed so a single screenshot demonstrates: correct proportions
// (player < fighter < bomber < boss), coherent theme (all same style),
// projectiles/effects working, pickups visible, scrolling bg parallax.

// Boss up top
spr(S.boss, 240, 110, 220, 220, 2);

// Enemy formation
spr(S.fighter, 120, 240, 72, 72, 3);
spr(S.fighter, 240, 220, 72, 72, 3);
spr(S.fighter, 360, 240, 72, 72, 3);
spr(S.bomber, 180, 340, 96, 96, 3);
spr(S.bomber, 300, 340, 96, 96, 3);
spr(S.scout,  80,  160, 48, 48, 3);
spr(S.scout,  400, 160, 48, 48, 3);

// Pickups drifting down
spr(S.pWeapon, 80,  440, 40, 40, 4);
spr(S.pShield, 400, 460, 40, 40, 4);
spr(S.pLife,   240, 500, 40, 40, 4);

// Enemy bullets raining down
spr(S.eBullet, 220, 400, 20, 20, 5);
spr(S.eBullet, 260, 430, 20, 20, 5);
spr(S.eBullet, 180, 480, 20, 20, 5);
spr(S.eBullet, 320, 520, 20, 20, 5);

// Player ship near bottom
spr(S.ship, 240, 620, 88, 88, 6);

// Player bullets streaming up
spr(S.pBullet, 220, 560, 16, 28, 7);
spr(S.pBullet, 260, 580, 16, 28, 7);
spr(S.pBullet, 220, 510, 16, 28, 7);
spr(S.pBullet, 260, 470, 16, 28, 7);

// Homing missiles angled outward
spr(S.missile, 200, 540, 24, 48, 7, -15);
spr(S.missile, 280, 540, 24, 48, 7,  15);

// Explosion mid-scene — proves effect layer renders
spr(S.boom, 300, 340, 120, 120, 8);

// Parallax scroll (visible in animated captures, still composes for stills)
let bgY = 0;
setInterval(() => { bgY = (bgY + 2) % 2048; bg.style.backgroundPositionY = bgY + 'px'; }, 33);
</script>
</body>
</html>
