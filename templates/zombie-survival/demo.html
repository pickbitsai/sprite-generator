<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Zombie Survival Template Demo</title>
<style>
html,body{margin:0;padding:0;background:#000;font-family:system-ui,sans-serif;color:#fff}
#stage{position:relative;width:640px;height:640px;margin:0 auto;overflow:hidden;box-shadow:0 0 40px rgba(255,60,60,0.25)}
#floor{position:absolute;inset:0;background-repeat:repeat;background-size:128px 128px}
#road{position:absolute;left:240px;top:0;width:160px;height:100%;background-repeat:repeat;background-size:160px 160px}
.spr{position:absolute;image-rendering:pixelated;pointer-events:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:monospace;font-size:14px;text-shadow:0 0 4px #000;z-index:20}
#banner{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;font-size:11px;color:#fcc;font-family:monospace;z-index:20;opacity:0.8}
</style></head><body>
<div id="stage">
  <div id="floor"></div>
  <div id="road"></div>
  <div id="hud"><span>HP 78/100</span><span>AMMO 24</span></div>
  <div id="banner">ZOMBIE SURVIVAL TEMPLATE — sprites generated by sprite-generator</div>
</div>
<script>
const OUTPUT=(new URL(location.href).searchParams.get('output'))||'../../output';
const S={player:`${OUTPUT}/character/player_survivor.png`,walker:`${OUTPUT}/enemy/zombie_walker.png`,runner:`${OUTPUT}/enemy/zombie_runner.png`,brute:`${OUTPUT}/enemy/zombie_brute.png`,
pistol:`${OUTPUT}/pickup/weapon_pistol.png`,shotgun:`${OUTPUT}/pickup/weapon_shotgun.png`,ammo:`${OUTPUT}/pickup/ammo_box.png`,medkit:`${OUTPUT}/pickup/medkit.png`,
blood:`${OUTPUT}/effect/blood_splatter.png`,grass:`${OUTPUT}/tile/grass_tile.png`,road:`${OUTPUT}/tile/road_tile.png`};
const stage=document.getElementById('stage');
document.getElementById('floor').style.backgroundImage=`url(${S.grass})`;
document.getElementById('road').style.backgroundImage=`url(${S.road})`;
function spr(src,x,y,w,h,z=1){const e=document.createElement('img');e.className='spr';e.src=src;
e.style.left=(x-w/2)+'px';e.style.top=(y-h/2)+'px';e.style.width=w+'px';e.style.height=h+'px';e.style.zIndex=z;
e.onerror=()=>{e.style.outline='1px dashed #f55';e.style.background='rgba(255,0,0,0.15)'};stage.appendChild(e);return e}
// Blood decals (low z)
spr(S.blood,250,300,96,96,2);
spr(S.blood,420,440,80,80,2);
// Pickups on the ground
spr(S.pistol, 80,160,56,56,3);
spr(S.shotgun,560,160,72,56,3);
spr(S.ammo,  100,440,48,48,3);
spr(S.medkit,540,440,48,48,3);
// Enemies closing in
spr(S.walker,180,200,80,80,4);
spr(S.walker,460,200,80,80,4);
spr(S.runner,120,320,72,72,4);
spr(S.runner,520,320,72,72,4);
spr(S.brute, 320,160,112,112,4);
// Player near bottom center
spr(S.player,320,520,88,88,5);
</script></body></html>
